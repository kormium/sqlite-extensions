version = 0.1.0-SNAPSHOT
group = io.github.kormium

# The vendored SQLite headers and the SPI both come from this Kormium release; the extension is
# compiled against those headers and links against the SQLite that release embeds.
kormiumVersion = 0.13.0

# sqlite-vec release to build from. The amalgamation is fetched at build time and checksummed.
sqliteVecVersion = 0.1.9

# Extensions from asg017's sqlite-ecosystem that are written in C, and so can be linked statically.
sqliteLinesVersion = 0.2.2
sqlitePathVersion = 0.2.1
sqliteUrlVersion = 0.1.0

org.gradle.jvmargs = -Xmx3g
org.gradle.caching = true

# The sqlitevec cinterop is registered under one name on every native target so it commonizes into
# the shared nativeMain source set — which only happens with this flag. Without it the shared source
# set cannot see the C declarations and only per-target compilation works, which is easy to miss
# because the per-target tasks pass either way.
kotlin.mpp.enableCInteropCommonization=true

# sqlite-lines reads with POSIX getdelim() and fmemopen(), which Windows does not have.
kormium-sqlite-lines.targets = linuxX64,macosX64,macosArm64,iosX64,iosArm64,iosSimulatorArm64
