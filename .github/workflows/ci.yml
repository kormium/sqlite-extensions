name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sqlite-extensions

      # kormium-sqlite-spi is not on Maven Central yet, so the build resolves Kormium from a
      # checkout beside this one (see settings.gradle.kts). Once the SPI ships this step can go and
      # the build can run standalone with -Pkormium.ignoreSibling=true.
      - uses: actions/checkout@v4
        with:
          repository: kormium/kormium
          path: kormium

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: sqlite-extensions
        run: ./gradlew build

      - name: Check the public ABI
        working-directory: sqlite-extensions
        run: ./gradlew apiCheck
