name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Standalone: resolve Kormium from Maven Central rather than a sibling checkout, which is
      # what a third-party author's build looks like.
      - name: Build and test
        run: ./gradlew build -Pkormium.ignoreSibling=true

      - name: Check the public ABI
        run: ./gradlew apiCheck -Pkormium.ignoreSibling=true
